name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check app tests scripts eval deploy
          uv run ruff format --check app tests scripts eval deploy
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Offline evaluation (gates on regressions)
        run: |
          uv run python eval/run_eval.py --mode extractive --tag ci
          uv run python eval/check_thresholds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Dependency audit
        # Ignored advisories affect only the Chroma *server* HTTP API / RBAC, which this app never
        # runs or exposes (it uses the embedded PersistentClient). See docs/SECURITY.md.
        run: |
          uv export --frozen --no-dev --no-hashes -o requirements.txt
          uvx pip-audit==2.10.1 -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
      - name: Static security lint (bandit rules via ruff)
        run: uvx ruff@0.17.1 check --select S app

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t industrial-power-ai:ci .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 industrial-power-ai:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 2; done
          curl -fsS -X POST localhost:8000/api/chat -H 'content-type: application/json' \
            -d '{"question":"What is a typical governor droop setting?"}' | tee /tmp/r.json
          grep -q '"status":"answered"' /tmp/r.json
          docker logs app | tail -20
