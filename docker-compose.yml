services:
  app:
    build: .
    image: industrial-power-ai:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/app/data/chroma
      - app-uploads:/app/data/uploads
    restart: unless-stopped
volumes:
  app-data:
  app-uploads:
